# Nginx: reverse proxy cổng 80 cho ứng dụng Quản lý container
#   /       -> file tĩnh frontend trong /var/www/qlcontainer (HTML/CSS/JS)
#   /api/   -> chuyển tiếp tới backend FastAPI chỉ lắng nghe 127.0.0.1:8000
# Đặt tại /etc/nginx/sites-available/qlcontainer và liên kết sang sites-enabled.

# Giới hạn tốc độ gọi API đăng nhập: 10 lần/phút mỗi IP (chống dò mật khẩu)
limit_req_zone $binary_remote_addr zone=qlc_login:10m rate=10r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;            # không lộ phiên bản Nginx trong header/trang lỗi
    client_max_body_size 1m;      # chặn request quá lớn
    root /var/www/qlcontainer;
    index index.html;

    # Header bảo mật (chống clickjacking, MIME sniffing, giới hạn nguồn script - CSP)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    access_log /var/log/nginx/qlcontainer.access.log;
    error_log  /var/log/nginx/qlcontainer.error.log;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|svg)$ {
        expires 1h;
        try_files $uri =404;
    }

    location = /api/auth/login {
        limit_req zone=qlc_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
